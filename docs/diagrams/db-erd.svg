<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1320" viewBox="0 0 1880 1320" role="img" aria-label="ER diagram de la base Garmin Coach Agent">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .head-blue { fill: #dbeafe; }
      .head-green { fill: #dcfce7; }
      .head-orange { fill: #ffedd5; }
      .head-purple { fill: #ede9fe; }
      .head-gray { fill: #f1f5f9; }
      .name { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .field { font: 400 13px Inter, Arial, sans-serif; fill: #334155; }
      .rel { stroke: #64748b; stroke-width: 2.6; fill: none; }
      .rel-dashed { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 8 7; }
      .label { font: 600 12px Inter, Arial, sans-serif; fill: #475569; }
      .legend { font: 400 13px Inter, Arial, sans-serif; fill: #334155; }
      .note { font: 400 12px Inter, Arial, sans-serif; fill: #64748b; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1880" height="1320"/>
  <text class="title" x="60" y="56">Garmin Coach Agent — ERD V0</text>
  <text class="subtitle" x="60" y="86">Aucun profil en base : le contexte personnel stable vit dans la mémoire agent.</text>

  <!-- Goals -->
  <rect class="box" x="80" y="170" width="360" height="220"/>
  <rect class="head-purple" x="80" y="170" width="360" height="34" rx="14"/>
  <text class="name" x="102" y="193">training_goals</text>
  <text class="field" x="102" y="226">PK id</text>
  <text class="field" x="102" y="248">goal_code, primary_goal, priority</text>
  <text class="field" x="102" y="270">horizon_date</text>
  <text class="field" x="102" y="292">target_event_name, target_event_date</text>
  <text class="field" x="102" y="314">status, raw_text, metadata_json</text>
  <text class="field" x="102" y="336">created_at, updated_at</text>

  <!-- Constraints -->
  <rect class="box" x="80" y="450" width="360" height="240"/>
  <rect class="head-orange" x="80" y="450" width="360" height="34" rx="14"/>
  <text class="name" x="102" y="473">constraints</text>
  <text class="field" x="102" y="506">PK id</text>
  <text class="field" x="102" y="528">FK goal_id → training_goals.id</text>
  <text class="field" x="102" y="550">type, severity, status, scope</text>
  <text class="field" x="102" y="572">start_date, end_date, source</text>
  <text class="field" x="102" y="594">confidence, raw_text</text>
  <text class="field" x="102" y="616">tags_json, notes_json</text>
  <text class="field" x="102" y="638">created_at, resolved_at, updated_at</text>

  <!-- Blocks/Plans -->
  <rect class="box" x="500" y="160" width="390" height="200"/>
  <rect class="head-green" x="500" y="160" width="390" height="34" rx="14"/>
  <text class="name" x="522" y="183">training_blocks</text>
  <text class="field" x="522" y="216">PK id</text>
  <text class="field" x="522" y="238">FK goal_id → training_goals.id</text>
  <text class="field" x="522" y="260">block_type, week_start, week_end</text>
  <text class="field" x="522" y="282">focus, load_target, status</text>
  <text class="field" x="522" y="304">metadata_json, created_at, updated_at</text>

  <rect class="box" x="500" y="400" width="390" height="220"/>
  <rect class="head-gray" x="500" y="400" width="390" height="34" rx="14"/>
  <text class="name" x="522" y="423">training_plans</text>
  <text class="field" x="522" y="456">PK id</text>
  <text class="field" x="522" y="478">FK block_id → training_blocks.id</text>
  <text class="field" x="522" y="500">week_start, week_end</text>
  <text class="field" x="522" y="522">status, generated_at, generated_by</text>
  <text class="field" x="522" y="544">confidence, needs_review</text>
  <text class="field" x="522" y="566">metadata_json, notes</text>
  <text class="field" x="522" y="588">created_at, updated_at</text>

  <rect class="box" x="500" y="670" width="390" height="250"/>
  <rect class="head-blue" x="500" y="670" width="390" height="34" rx="14"/>
  <text class="name" x="522" y="693">plan_sessions</text>
  <text class="field" x="522" y="726">PK id</text>
  <text class="field" x="522" y="748">FK plan_id → training_plans.id</text>
  <text class="field" x="522" y="770">planned_date, planned_time</text>
  <text class="field" x="522" y="792">activity_type, duration_min</text>
  <text class="field" x="522" y="814">intensity, target_hr_low/high</text>
  <text class="field" x="522" y="836">target_pace_sec_per_km, target_rpe</text>
  <text class="field" x="522" y="858">status, garmin_event_id</text>
  <text class="field" x="522" y="880">workout_payload_json, tags_json, notes</text>

  <rect class="box" x="960" y="400" width="400" height="230"/>
  <rect class="head-purple" x="960" y="400" width="400" height="34" rx="14"/>
  <text class="name" x="982" y="423">plan_reviews</text>
  <text class="field" x="982" y="456">PK id</text>
  <text class="field" x="982" y="478">FK plan_id → training_plans.id</text>
  <text class="field" x="982" y="500">reviewed_at, reviewed_by</text>
  <text class="field" x="982" y="522">reason, summary</text>
  <text class="field" x="982" y="544">suggested_changes_json</text>
  <text class="field" x="982" y="566">outcome, needs_goal_review</text>
  <text class="field" x="982" y="588">created_at</text>

  <rect class="box" x="960" y="690" width="400" height="200"/>
  <rect class="head-gray" x="960" y="690" width="400" height="34" rx="14"/>
  <text class="name" x="982" y="713">plan_activity_matches</text>
  <text class="field" x="982" y="746">PK id</text>
  <text class="field" x="982" y="768">FK plan_session_id → plan_sessions.id</text>
  <text class="field" x="982" y="790">FK activity_id → activities.id</text>
  <text class="field" x="982" y="812">match_type, confidence</text>
  <text class="field" x="982" y="834">matched_at, notes</text>

  <rect class="box" x="1430" y="170" width="390" height="270"/>
  <rect class="head-orange" x="1430" y="170" width="390" height="34" rx="14"/>
  <text class="name" x="1452" y="193">activities</text>
  <text class="field" x="1452" y="226">PK id</text>
  <text class="field" x="1452" y="248">UNIQUE(source, external_id)</text>
  <text class="field" x="1452" y="270">source, external_id, device_id</text>
  <text class="field" x="1452" y="292">activity_type, activity_name</text>
  <text class="field" x="1452" y="314">start_time_utc, local_start_time, timezone</text>
  <text class="field" x="1452" y="336">duration_s, moving_duration_s</text>
  <text class="field" x="1452" y="358">distance_m, calories_kcal</text>
  <text class="field" x="1452" y="380">HR / pace / cadence / power</text>
  <text class="field" x="1452" y="402">raw_payload_json, imported_at, updated_at</text>

  <rect class="box" x="1430" y="480" width="390" height="230"/>
  <rect class="head-green" x="1430" y="480" width="390" height="34" rx="14"/>
  <text class="name" x="1452" y="503">daily_metrics</text>
  <text class="field" x="1452" y="536">PK id</text>
  <text class="field" x="1452" y="558">UNIQUE(source, metric_date)</text>
  <text class="field" x="1452" y="580">source, metric_date, timezone</text>
  <text class="field" x="1452" y="602">steps, distance_m, floors_climbed</text>
  <text class="field" x="1452" y="624">intensity_minutes, active_calories_kcal</text>
  <text class="field" x="1452" y="646">resting_hr, stress_avg, body_battery_* </text>
  <text class="field" x="1452" y="668">raw_payload_json, imported_at, updated_at</text>

  <rect class="box" x="1430" y="770" width="390" height="180"/>
  <rect class="head-gray" x="1430" y="770" width="390" height="34" rx="14"/>
  <text class="name" x="1452" y="793">sync_runs</text>
  <text class="field" x="1452" y="826">PK id</text>
  <text class="field" x="1452" y="848">source, sync_type, started_at, finished_at</text>
  <text class="field" x="1452" y="870">status, range_start, range_end</text>
  <text class="field" x="1452" y="892">counters, cursor_value, error_message</text>

  <rect class="box" x="1430" y="1010" width="390" height="100"/>
  <rect class="head-blue" x="1430" y="1010" width="390" height="34" rx="14"/>
  <text class="name" x="1452" y="1033">schema_migrations</text>
  <text class="field" x="1452" y="1065">PK version, applied_at</text>

  <!-- Relations -->
  <path class="rel" d="M440 300 C470 300, 475 300, 500 300" marker-end="url(#arrow)"/>
  <text class="label" x="450" y="286">1 → N</text>

  <path class="rel-dashed" d="M260 690 C260 710, 280 715, 310 720" marker-end="url(#arrow)"/>
  <text class="label" x="272" y="710">0..1 → N</text>

  <path class="rel" d="M890 260 C930 260, 940 260, 960 260" marker-end="url(#arrow)"/>
  <text class="label" x="920" y="246">1 → N</text>

  <path class="rel" d="M695 360 L695 400" marker-end="url(#arrow)"/>
  <text class="label" x="708" y="386">1 → N</text>

  <path class="rel" d="M695 620 L695 670" marker-end="url(#arrow)"/>
  <text class="label" x="708" y="652">1 → N</text>

  <path class="rel" d="M900 510 C930 510, 940 510, 960 510" marker-end="url(#arrow)"/>
  <text class="label" x="918" y="494">1 → N</text>

  <path class="rel" d="M900 785 C930 785, 940 785, 960 785" marker-end="url(#arrow)"/>
  <text class="label" x="918" y="770">1 → N</text>

  <path class="rel" d="M1430 310 C1410 310, 1405 820, 1330 790" marker-end="url(#arrow)"/>
  <text class="label" x="1395" y="548">1 → N</text>

  <!-- Legend -->
  <rect x="80" y="980" width="1330" height="220" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="18"/>
  <text class="name" x="110" y="1018">Lecture des liens</text>
  <text class="legend" x="110" y="1052">• `training_goals` est le point d’entrée du plan ; les contraintes peuvent être liées à un objectif ou rester générales.</text>
  <text class="legend" x="110" y="1082">• `training_blocks` structure le macro-cycle, puis `training_plans` matérialise la semaine, puis `plan_sessions` détaille les séances.</text>
  <text class="legend" x="110" y="1112">• `plan_reviews` documente les révisions et permet de détecter quand une révision d’objectifs devient nécessaire.</text>
  <text class="legend" x="110" y="1142">• `activities` et `daily_metrics` sont indépendantes du plan ; une séance hors planning reste une activité valide.</text>
  <text class="legend" x="110" y="1172">• `plan_activity_matches` relie seulement quand il y a correspondance entre prévu et réalisé.</text>
  <text class="legend" x="110" y="1202">• `sync_runs` et `schema_migrations` sont des tables de support, hors flux métier principal.</text>
</svg>
